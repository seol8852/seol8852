<svg width="800" height="340" viewBox="0 0 800 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 고급스러운 딥 네이비/인디고 그라디언트 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 은은한 소프트 오로라 조명 (네온이 아닌 자연스러운 블러) -->
    <radialGradient id="aurora" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- 카드 외곽선 그라디언트 -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 부드러운 가독성 그림자 -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 카드 배경 및 테두리 -->
  <rect x="10" y="10" width="780" height="320" rx="18" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.8" filter="url(#soft-shadow)"/>
  <rect x="10" y="10" width="780" height="320" rx="18" fill="url(#aurora)"/>

  <!-- 상단 라벨 뱃지 -->
  <rect x="42" y="36" width="130" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="107" y="53" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">CORE PHILOSOPHY</text>

  <!-- 메인 명대사 (큼직하고 선명한 화이트) -->
  <text x="42" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="27" font-weight="900" letter-spacing="-0.5">
    "정규야, 네가 '정규화'할 때 난 '설계'한다."
  </text>

  <!-- 3단 콤보 (글자 크고 시원시원함 20px) -->
  <text x="44" y="172" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="20" font-weight="600">
    ⚙️   시스템 <tspan fill="#38bdf8" font-weight="900">[설]</tspan>계부터
  </text>
  
  <text x="44" y="216" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="20" font-weight="600">
    🔍   변수 유효 <tspan fill="#38bdf8" font-weight="900">[범]</tspan>위 체크,
  </text>
  
  <text x="44" y="260" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="20" font-weight="600">
    📏   코딩 표준 <tspan fill="#38bdf8" font-weight="900">[준]</tspan>수까지.
  </text>

  <!-- 하단 펀치라인 마무리 -->
  <line x1="42" y1="285" x2="758" y2="285" stroke="#334155" stroke-width="1"/>
  <text x="44" y="308" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="14" font-weight="600">
    🚀  완벽하게 <tspan fill="#38bdf8" font-weight="800">[준]</tspan>비된 개발자, 설범준
  </text>
</svg>