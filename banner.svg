<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle drop shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="12" y="12" width="776" height="396" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2" filter="url(#card-shadow)"/>

  <!-- Terminal Top Bar -->
  <path d="M 12 26 A 14 14 0 0 1 26 12 L 774 12 A 14 14 0 0 1 788 26 L 788 48 L 12 48 Z" fill="#161b22"/>
  <line x1="12" y1="48" x2="788" y2="48" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Buttons -->
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="400" y="34" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">terminal — bash seol_beom_jun.sh</text>

  <!-- Main Quote (Crisp & Readable) -->
  <text x="40" y="98" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="21" font-weight="800">"정규야, 네가 '정규화'할 때 난 '설계'한다."</text>

  <!-- 3 Combo Lines -->
  <text x="40" y="142" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="15.5">⚙️  시스템 <tspan fill="#f0883e" font-weight="800">[설]</tspan>계부터</text>
  <text x="40" y="174" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="15.5">🔍  변수 유효 <tspan fill="#f0883e" font-weight="800">[범]</tspan>위 체크,</text>
  <text x="40" y="206" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="15.5">📏  코딩 표준 <tspan fill="#f0883e" font-weight="800">[준]</tspan>수까지.</text>

  <!-- Q&A Callout Box -->
  <rect x="40" y="235" width="720" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="268" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="600">🚨 Q. 이번 배포로 프로덕션 서버 터뜨린 주<tspan fill="#f0883e" font-weight="800">[범]</tspan>이 누구죠?</text>
  <text x="60" y="299" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="700">👀 A. <tspan fill="#f0883e" font-weight="800">[설]</tspan>마... <tspan fill="#f0883e" font-weight="800">[범]</tspan>인이 저 설<tspan fill="#f0883e" font-weight="800">[범준]</tspan>이겠습니까? 🤷‍♂️</text>

  <!-- Footer Line -->
  <line x1="40" y1="344" x2="760" y2="344" stroke="#21262d" stroke-width="1"/>
  <text x="40" y="380" fill="#2f81f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">🚀 완벽하게 <tspan fill="#f0883e" font-weight="800">[준]</tspan>비된 개발자, 설범준입니다.</text>
</svg>