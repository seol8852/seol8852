<svg width="800" height="170" viewBox="0 0 800 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 고급스러운 딥 슬레이트 그라디언트 배경 -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- 은은한 상단 테두리 글로우 -->
    <linearGradient id="header-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 배경 카드 -->
  <rect x="10" y="10" width="780" height="150" rx="16" fill="url(#header-grad)" stroke="url(#header-border)" stroke-width="1.8" filter="url(#shadow)"/>

  <!-- Q 라인 (좌우 여백 넉넉하게 완벽 중앙 정렬, 절대 안 잘림) -->
  <text x="400" y="68" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    🚨 Q. 이번 배포로 프로덕션 서버 터뜨린 주<tspan fill="#fbbf24" font-weight="900">[범]</tspan>이 누구죠?
  </text>

  <!-- A 라인 (여유롭고 선명하게 중앙 정렬) -->
  <text x="400" y="112" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif" font-size="19" font-weight="800" text-anchor="middle">
    👀 A. <tspan fill="#fbbf24" font-weight="900">[설]</tspan>마... <tspan fill="#fbbf24" font-weight="900">[범]</tspan>인이 저 설<tspan fill="#fbbf24" font-weight="900">[범준]</tspan>이겠습니까? 🤷‍♂️
  </text>
</svg>