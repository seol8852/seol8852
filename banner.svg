<svg fill="none" viewBox="0 0 800 340" width="800" height="340" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 26px 32px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace;
          color: #c9d1d9;
          box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }
        .header {
          display: flex;
          align-items: center;
          margin-bottom: 24px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .title { color: #8b949e; font-size: 13px; margin-left: 10px; font-weight: 500; }
        .quote {
          font-size: 21px;
          font-weight: 700;
          color: #58a6ff;
          margin-bottom: 22px;
          text-shadow: 0 0 12px rgba(88,166,255,0.3);
        }
        .line {
          font-size: 16px;
          line-height: 1.9;
          color: #e6edf3;
        }
        .highlight {
          color: #f0883e;
          font-weight: 800;
          background: rgba(240,136,62,0.15);
          padding: 2px 6px;
          border-radius: 4px;
          margin: 0 2px;
        }
        .footer {
          margin-top: 18px;
          padding-top: 16px;
          border-top: 1px dashed #30363d;
          font-size: 17px;
          color: #7ee787;
          font-weight: 600;
        }
      </style>

      <div class="terminal">
        <div class="header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="title">bash - seol_beom_jun.sh</span>
        </div>

        <div class="quote">
          "정규야, 네가 '정규화'할 때 난 '설계'한다."
        </div>

        <div class="line">⚙️ 시스템 <span class="highlight">[설]</span>계부터</div>
        <div class="line">🔍 변수 유효 <span class="highlight">[범]</span>위 체크,</div>
        <div class="line">📏 코딩 표준 <span class="highlight">[준]</span>수까지.</div>

        <div class="footer">
          완벽하게 <span class="highlight">[준]</span>비된 개발자, 설범준입니다.
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
